name: Deploy CAENS Browser Preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "apps/browser/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/browser/web/package.json
      - name: Install dependencies
        working-directory: apps/browser/web
        run: npm install
      - name: Build TypeScript app
        working-directory: apps/browser/web
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/browser/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
